    <script>
      // Themasysteem (src/features/theme): zet het laatst gekozen thema al
      // vóór React laadt, zodat er geen flits van het standaardthema is.
      // Leest alleen de kant-en-klare cache die ThemeProvider bijhoudt.
      (function () {
        try {
          var t = JSON.parse(
            localStorage.getItem("onshuisje.theme.applied.v1") || "null",
          );
          if (!t || t.v !== 1) return;
          var path = (location.hash.replace(/^#/, "") || "/").split("?")[0];
          for (var i = 0; i < t.excluded.length; i++) {
            var p = t.excluded[i];
            if (path === p || path.indexOf(p + "/") === 0) return;
          }
          var root = document.documentElement;
          for (var k in t.vars) root.style.setProperty(k, t.vars[k]);
          for (var a in t.attrs) root.setAttribute(a, t.attrs[a]);
          for (var j = 0; j < t.fonts.length; j++) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = t.fonts[j];
            l.setAttribute("data-ht-font", t.fonts[j]);
            document.head.appendChild(l);
          }
        } catch (e) {
          // Kapotte cache: gewoon het originele uiterlijk.
        }
      })();
    </script>
